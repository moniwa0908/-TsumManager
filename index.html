<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ツム管理">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<title>TsumManager Ver.2</title>
<style>
:root{
 --bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;
 --accent:#7c3aed;--accent2:#a855f7;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;
 --shadow:0 9px 28px rgba(15,23,42,.07)
}
@media(prefers-color-scheme:dark){
 :root{--bg:#0f172a;--card:#182235;--text:#f8fafc;--muted:#a7b0c0;--line:#2d3a50;--shadow:none}
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:820px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 40px)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
h1{margin:0;font-size:25px;letter-spacing:.02em}.version{font-size:12px;color:var(--muted);margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}
.btn{border:0;border-radius:13px;padding:11px 13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800}
.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:#fee2e2;color:#991b1b}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.summary .card{padding:15px}.label{font-size:13px;color:var(--muted)}.big{font-size:28px;font-weight:900;margin-top:3px}
.progress{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:9px}.progress>div{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}.mini{padding:11px;text-align:center}.mini b{display:block;font-size:19px}.mini span{font-size:11px;color:var(--muted)}
.toolbar{padding:11px;margin-bottom:10px}.toolbar-top{display:grid;grid-template-columns:1fr 150px;gap:8px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:13px;padding:11px 12px;min-height:44px}
.filters{display:flex;gap:7px;overflow:auto;padding:9px 0 1px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:9px 12px;background:var(--card);color:var(--text);font-weight:750}.chip.active{border-color:transparent;background:var(--accent);color:#fff}
.subfilters{display:flex;gap:7px;overflow:auto;padding-top:8px}.subfilters .chip{font-size:13px;padding:8px 11px}
.list{display:flex;flex-direction:column;gap:9px}.item{padding:11px;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;align-items:center}
.avatar{width:58px;height:58px;border-radius:17px;background:linear-gradient(145deg,#ede9fe,#f5f3ff);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);font-size:26px;font-weight:900;color:var(--accent)}
.avatar img{width:100%;height:100%;object-fit:cover}.name-row{display:flex;align-items:center;gap:5px;min-width:0}.name{font-weight:900;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fav{border:0;background:none;color:#c4c4cc;font-size:21px;padding:0}.fav.on{color:#f59e0b}
.meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}.tiny-progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:7px}.tiny-progress>div{height:100%;background:var(--accent)}
.controls{display:flex;align-items:center;gap:6px}.counter-btn{width:39px;height:39px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:22px;font-weight:900;padding:0}.counter-btn.plus{background:var(--accent);border-color:var(--accent);color:#fff}.count{min-width:64px;text-align:center;font-weight:900}.max{color:var(--ok)}
.more{border:0;background:none;color:var(--muted);font-size:20px;padding:4px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.actions .btn{font-size:13px}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin:12px 3px 0}
.empty{text-align:center;color:var(--muted);padding:34px 12px}
dialog{border:0;border-radius:20px;background:var(--card);color:var(--text);width:min(94vw,530px);padding:0;box-shadow:0 24px 80px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(0,0,0,.48)}.modal{padding:18px}.modal h2{margin:0 0 13px}.grid{display:grid;gap:9px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.wide{grid-column:1/-1}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.hint{font-size:11px;color:var(--muted);line-height:1.5}
textarea{min-height:180px;resize:vertical}.image-preview{width:82px;height:82px;border:1px solid var(--line);border-radius:18px;object-fit:cover;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;border-radius:999px;padding:10px 14px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99}.toast.show{opacity:1}
@media(max-width:560px){
 .toolbar-top{grid-template-columns:1fr 120px}.item{grid-template-columns:52px minmax(0,1fr);}.avatar{width:52px;height:52px}.controls{grid-column:1/-1;justify-content:flex-end;margin-top:-2px}.actions{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}
}
</style>
</head>
<body>
<main class="wrap">
<header>
 <div><h1>ツム管理</h1><div class="version">TsumManager Ver.2</div></div>
 <button class="btn secondary" id="addBtn">＋追加</button>
</header>

<section class="summary">
 <div class="card"><div class="label">スキルマ</div><div class="big" id="maxed">0 / 0</div><div class="progress"><div id="bar"></div></div></div>
 <div class="card"><div class="label">残り必要数</div><div class="big" id="remaining">0</div><div class="label" id="completion">進捗 0%</div></div>
</section>

<section class="stats">
 <div class="card mini"><b id="ownedCount">0</b><span>所持済み</span></div>
 <div class="card mini"><b id="favoriteCount">0</b><span>お気に入り</span></div>
 <div class="card mini"><b id="coinNeed">0</b><span>必要コイン</span></div>
</section>

<section class="card toolbar">
 <div class="toolbar-top">
  <input id="search" type="search" placeholder="ツム名を検索">
  <select id="sort">
   <option value="name">名前順</option>
   <option value="newest">新しい順</option>
   <option value="remaining">残りが少ない順</option>
   <option value="progress">進捗が高い順</option>
  </select>
 </div>
 <div class="filters" id="categoryFilters"></div>
 <div class="subfilters" id="statusFilters">
  <button class="chip active" data-status="all">すべて</button>
  <button class="chip" data-status="unowned">未所持</button>
  <button class="chip" data-status="owned">所持済み</button>
  <button class="chip" data-status="max">スキルマ</button>
  <button class="chip" data-status="favorite">★お気に入り</button>
 </div>
</section>

<section class="list" id="list"></section>

<section class="actions">
 <button class="btn secondary" id="exportBtn">バックアップ出力</button>
 <button class="btn secondary" id="importBtn">バックアップ読込</button>
 <button class="btn secondary" id="bulkBtn">一覧を一括追加</button>
</section>
<div class="note">Ver.1のSafari保存データは初回起動時に自動移行します。画像は各ツムの編集画面から設定できます。データは端末内に保存されます。</div>
</main>

<dialog id="editDialog">
 <form class="modal grid" id="editForm">
  <h2 id="editTitle">ツムを追加</h2>
  <input type="hidden" id="editId">
  <div class="form-grid">
   <div class="wide"><input id="editName" required placeholder="ツム名"></div>
   <input id="editCategory" required placeholder="カテゴリ">
   <input id="editMax" required type="number" min="1" max="999" placeholder="スキルマ必要数">
   <input id="editOwned" required type="number" min="0" max="999" placeholder="現在数">
   <input id="editYear" type="number" min="2014" max="2100" placeholder="登場年">
   <div class="wide"><input id="editImage" placeholder="画像URL（任意）"></div>
   <div class="wide"><textarea id="editNote" placeholder="メモ（任意）"></textarea></div>
  </div>
  <div class="hint">画像URLには、自分で用意した画像のURLを入力できます。未設定時は名前の先頭文字を表示します。</div>
  <div class="modal-actions">
   <button type="button" class="btn danger" id="deleteBtn">削除</button>
   <button type="button" class="btn secondary" id="cancelEdit">キャンセル</button>
   <button type="submit" class="btn">保存</button>
  </div>
 </form>
</dialog>

<dialog id="dataDialog">
 <div class="modal grid">
  <h2 id="dataTitle">バックアップ</h2>
  <textarea id="dataText"></textarea>
  <div class="hint" id="dataHint"></div>
  <div class="modal-actions">
   <button class="btn secondary" id="closeData">閉じる</button>
   <button class="btn" id="copyData">コピー</button>
   <button class="btn" id="applyImport">読み込む</button>
  </div>
 </div>
</dialog>

<dialog id="bulkDialog">
 <div class="modal grid">
  <h2>一覧を一括追加</h2>
  <textarea id="bulkText" placeholder="1行に1体&#10;ツム名,カテゴリ,必要数,登場年&#10;&#10;例：&#10;ベル,プレミアム,36,2015"></textarea>
  <div class="hint">既に同じ名前のツムがある場合は追加しません。カテゴリ・必要数・登場年は省略可能です。</div>
  <div class="modal-actions">
   <button class="btn secondary" id="closeBulk">キャンセル</button>
   <button class="btn" id="applyBulk">追加する</button>
  </div>
 </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const KEY="tsumManagerDataV2";
const V1KEY="tsumManagerDataV1";
const DEFAULT_TSums=[
{id:"mickey",name:"ミッキー",category:"ハピネス",maxCopies:8,owned:0,year:2014,favorite:false,image:"",note:""},
{id:"minnie",name:"ミニー",category:"ハピネス",maxCopies:8,owned:0,year:2014,favorite:false,image:"",note:""},
{id:"donald",name:"ドナルド",category:"ハピネス",maxCopies:8,owned:0,year:2014,favorite:false,image:"",note:""},
{id:"daisy",name:"デイジー",category:"ハピネス",maxCopies:8,owned:0,year:2014,favorite:false,image:"",note:""},
{id:"goofy",name:"グーフィー",category:"ハピネス",maxCopies:8,owned:0,year:2014,favorite:false,image:"",note:""},
{id:"pluto",name:"プルート",category:"ハピネス",maxCopies:8,owned:0,year:2014,favorite:false,image:"",note:""},
{id:"chip",name:"チップ",category:"ハピネス",maxCopies:8,owned:0,year:2014,favorite:false,image:"",note:""},
{id:"dale",name:"デール",category:"ハピネス",maxCopies:8,owned:0,year:2014,favorite:false,image:"",note:""},
{id:"pooh",name:"プー",category:"ハピネス",maxCopies:8,owned:0,year:2014,favorite:false,image:"",note:""},
{id:"piglet",name:"ピグレット",category:"ハピネス",maxCopies:8,owned:0,year:2014,favorite:false,image:"",note:""},
{id:"tigger",name:"ティガー",category:"ハピネス",maxCopies:8,owned:0,year:2014,favorite:false,image:"",note:""},
{id:"eeyore",name:"イーヨー",category:"ハピネス",maxCopies:8,owned:0,year:2014,favorite:false,image:"",note:""},
{id:"cinderella",name:"シンデレラ",category:"プレミアム",maxCopies:36,owned:0,year:2016,favorite:false,image:"",note:""},
{id:"elsa",name:"エルサ",category:"プレミアム",maxCopies:36,owned:0,year:2014,favorite:false,image:"",note:""},
{id:"maleficent",name:"マレフィセント",category:"プレミアム",maxCopies:36,owned:0,year:2014,favorite:false,image:"",note:""},
{id:"beast",name:"野獣",category:"プレミアム",maxCopies:36,owned:0,year:2015,favorite:false,image:"",note:""},
{id:"jedi-luke",name:"ジェダイルーク",category:"期間限定",maxCopies:36,owned:0,year:2016,favorite:false,image:"",note:""},
{id:"captain-lightyear",name:"キャプテンライトイヤー",category:"期間限定",maxCopies:36,owned:0,year:2022,favorite:false,image:"",note:""}
];

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
const norm=t=>({
 id:t.id||("u-"+Date.now()+"-"+Math.random().toString(36).slice(2)),
 name:String(t.name||"名称未設定"),
 category:String(t.category||"未分類"),
 maxCopies:Math.max(1,Number(t.maxCopies||t.required||36)),
 owned:Math.max(0,Number(t.owned||0)),
 year:Number(t.year||0),
 favorite:Boolean(t.favorite),
 image:String(t.image||t.imageUrl||""),
 note:String(t.note||"")
});
function load(){
 try{
  const v2=JSON.parse(localStorage.getItem(KEY)||"null");
  if(Array.isArray(v2)&&v2.length)return v2.map(norm);
  const v1=JSON.parse(localStorage.getItem(V1KEY)||"null");
  if(Array.isArray(v1)&&v1.length){
   const migrated=v1.map(norm);localStorage.setItem(KEY,JSON.stringify(migrated));return migrated;
  }
 }catch(e){}
 return DEFAULT_TSums.map(x=>({...x}));
}
let tsums=load(),activeCategory="すべて",activeStatus="all";
const save=()=>localStorage.setItem(KEY,JSON.stringify(tsums));
function remain(t){return Math.max(0,t.maxCopies-t.owned)}
function pct(t){return Math.min(100,Math.round(t.owned/t.maxCopies*100))}
function skillLabel(t){
 const p=t.owned/t.maxCopies;
 if(t.owned<=0)return"未所持";
 if(p>=1)return"スキルMAX";
 if(p<.08)return"SL1";
 if(p<.20)return"SL2";
 if(p<.38)return"SL3";
 if(p<.58)return"SL4";
 if(p<.78)return"SL5";
 return"SL6途中";
}
function toast(msg){const e=$("#toast");e.textContent=msg;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1700)}
function render(){
 const q=$("#search").value.trim().toLowerCase(),sortBy=$("#sort").value;
 const cats=["すべて",...new Set(tsums.map(t=>t.category).filter(Boolean))];
 $("#categoryFilters").innerHTML=cats.map(c=>`<button class="chip ${c===activeCategory?"active":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
 $("#categoryFilters").querySelectorAll("button").forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;render()});
 $("#statusFilters").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.status===activeStatus));

 let rows=tsums.filter(t=>{
  const cat=activeCategory==="すべて"||t.category===activeCategory;
  const text=t.name.toLowerCase().includes(q)||(t.note||"").toLowerCase().includes(q);
  const st=activeStatus==="all"||
   (activeStatus==="unowned"&&t.owned===0)||
   (activeStatus==="owned"&&t.owned>0&&remain(t)>0)||
   (activeStatus==="max"&&remain(t)===0)||
   (activeStatus==="favorite"&&t.favorite);
  return cat&&text&&st;
 });
 rows.sort((a,b)=>{
  if(sortBy==="remaining")return remain(a)-remain(b)||a.name.localeCompare(b.name,"ja");
  if(sortBy==="progress")return pct(b)-pct(a)||a.name.localeCompare(b.name,"ja");
  if(sortBy==="newest")return (b.year||0)-(a.year||0)||a.name.localeCompare(b.name,"ja");
  return a.name.localeCompare(b.name,"ja");
 });
 $("#list").innerHTML=rows.length?rows.map(t=>{
  const r=remain(t),p=pct(t),initial=esc(t.name.trim().slice(0,1)||"ツ");
  const image=t.image?`<img src="${esc(t.image)}" alt="" onerror="this.remove();this.parentNode.textContent='${initial}'">`:initial;
  return `<article class="card item">
   <div class="avatar">${image}</div>
   <div>
    <div class="name-row"><button class="fav ${t.favorite?"on":""}" data-act="fav" data-id="${esc(t.id)}">★</button><div class="name">${esc(t.name)}</div><button class="more" data-act="edit" data-id="${esc(t.id)}">•••</button></div>
    <div class="meta">${esc(t.category)}${t.year?` ・ ${t.year}年`:""} ・ ${skillLabel(t)}<br>残り ${r} ・ ${p}%${t.note?` ・ ${esc(t.note)}`:""}</div>
    <div class="tiny-progress"><div style="width:${p}%"></div></div>
   </div>
   <div class="controls">
    <button class="counter-btn" data-act="minus" data-id="${esc(t.id)}">−</button>
    <div class="count ${r===0?"max":""}">${t.owned}/${t.maxCopies}</div>
    <button class="counter-btn plus" data-act="plus" data-id="${esc(t.id)}">＋</button>
   </div>
  </article>`;
 }).join(""):`<div class="empty">該当するツムがありません</div>`;

 $("#list").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  const t=tsums.find(x=>x.id===b.dataset.id);if(!t)return;
  if(b.dataset.act==="plus")t.owned=Math.min(t.maxCopies,t.owned+1);
  if(b.dataset.act==="minus")t.owned=Math.max(0,t.owned-1);
  if(b.dataset.act==="fav")t.favorite=!t.favorite;
  if(b.dataset.act==="edit"){openEdit(t);return}
  save();render();
 });

 const max=tsums.filter(t=>remain(t)===0).length;
 const rem=tsums.reduce((s,t)=>s+remain(t),0);
 const total=tsums.reduce((s,t)=>s+t.maxCopies,0);
 const own=tsums.reduce((s,t)=>s+Math.min(t.owned,t.maxCopies),0);
 const progress=total?Math.round(own/total*100):0;
 $("#maxed").textContent=`${max} / ${tsums.length}`;
 $("#remaining").textContent=rem.toLocaleString("ja-JP");
 $("#completion").textContent=`全体進捗 ${progress}%`;
 $("#bar").style.width=`${progress}%`;
 $("#ownedCount").textContent=tsums.filter(t=>t.owned>0).length;
 $("#favoriteCount").textContent=tsums.filter(t=>t.favorite).length;
 $("#coinNeed").textContent=(rem*30000).toLocaleString("ja-JP");
}
function openEdit(t=null){
 $("#editTitle").textContent=t?"ツムを編集":"ツムを追加";
 $("#editId").value=t?.id||"";
 $("#editName").value=t?.name||"";
 $("#editCategory").value=t?.category||"プレミアム";
 $("#editMax").value=t?.maxCopies||36;
 $("#editOwned").value=t?.owned||0;
 $("#editYear").value=t?.year||"";
 $("#editImage").value=t?.image||"";
 $("#editNote").value=t?.note||"";
 $("#deleteBtn").style.display=t?"":"none";
 $("#editDialog").showModal();
}
$("#addBtn").onclick=()=>openEdit();
$("#cancelEdit").onclick=()=>$("#editDialog").close();
$("#editForm").onsubmit=e=>{
 e.preventDefault();
 const id=$("#editId").value;
 const obj=norm({id:id||undefined,name:$("#editName").value.trim(),category:$("#editCategory").value.trim(),maxCopies:$("#editMax").value,owned:$("#editOwned").value,year:$("#editYear").value,image:$("#editImage").value.trim(),note:$("#editNote").value.trim()});
 if(id){const i=tsums.findIndex(t=>t.id===id);if(i>=0)tsums[i]={...tsums[i],...obj,id}}
 else tsums.push(obj);
 save();$("#editDialog").close();render();toast("保存しました");
};
$("#deleteBtn").onclick=()=>{
 const id=$("#editId").value;if(!id)return;
 if(confirm("このツムを削除しますか？")){tsums=tsums.filter(t=>t.id!==id);save();$("#editDialog").close();render();toast("削除しました")}
};
$("#search").oninput=render;$("#sort").onchange=render;
$("#statusFilters").querySelectorAll("button").forEach(b=>b.onclick=()=>{activeStatus=b.dataset.status;render()});

$("#exportBtn").onclick=()=>{
 $("#dataTitle").textContent="バックアップ出力";
 $("#dataText").value=JSON.stringify({app:"TsumManager",version:2,exportedAt:new Date().toISOString(),tsums},null,2);
 $("#dataHint").textContent="内容をコピーして、iPhoneのメモなどに保存してください。";
 $("#applyImport").style.display="none";$("#copyData").style.display="";$("#dataDialog").showModal();
};
$("#importBtn").onclick=()=>{
 $("#dataTitle").textContent="バックアップ読込";$("#dataText").value="";
 $("#dataHint").textContent="Ver.1の配列形式、またはVer.2のバックアップ形式を読み込めます。";
 $("#applyImport").style.display="";$("#copyData").style.display="none";$("#dataDialog").showModal();
};
$("#closeData").onclick=()=>$("#dataDialog").close();
$("#copyData").onclick=async()=>{try{await navigator.clipboard.writeText($("#dataText").value);toast("コピーしました")}catch(e){$("#dataText").select();document.execCommand("copy");toast("コピーしました")}};
$("#applyImport").onclick=()=>{
 try{
  const raw=JSON.parse($("#dataText").value);
  const arr=Array.isArray(raw)?raw:raw.tsums;
  if(!Array.isArray(arr))throw new Error();
  tsums=arr.map(norm);save();$("#dataDialog").close();render();toast("読み込みました");
 }catch(e){alert("バックアップの形式が正しくありません")}
};

$("#bulkBtn").onclick=()=>$("#bulkDialog").showModal();
$("#closeBulk").onclick=()=>$("#bulkDialog").close();
$("#applyBulk").onclick=()=>{
 const lines=$("#bulkText").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 let added=0;
 for(const line of lines){
  const [name,category="プレミアム",max="36",year=""] = line.split(",").map(x=>x.trim());
  if(!name||tsums.some(t=>t.name===name))continue;
  tsums.push(norm({name,category,maxCopies:Number(max)||36,year:Number(year)||0,owned:0}));added++;
 }
 save();$("#bulkDialog").close();$("#bulkText").value="";render();toast(`${added}体追加しました`);
};

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}))}
render();
</script>
</body>
</html>
