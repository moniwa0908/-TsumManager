<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ツム管理">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="./style.css">
<title>TsumManager Ver.4</title>
</head>
<body>
<div id="app">
<header class="topbar">
  <div><h1>ツム管理</h1><p>TsumManager Ver.4</p></div>
  <div class="head-actions">
    <button id="drawButton" class="head-btn">BOX入力</button>
    <button id="addButton" class="icon-btn" aria-label="ツム追加">＋</button>
  </div>
</header>

<section class="hero">
  <div class="hero-main">
    <span>全体進捗</span><strong id="overallPercent">0%</strong>
    <div class="progress"><i id="overallBar"></i></div>
  </div>
  <div class="hero-grid">
    <div><b id="maxCount">0</b><span>スキルマ</span></div>
    <div><b id="ownedTsumCount">0</b><span>所持済み</span></div>
    <div><b id="remainCount">0</b><span>残り必要数</span></div>
    <div><b id="coinCount">0</b><span>必要コイン</span></div>
  </div>
</section>

<nav class="tabs">
  <button class="active" data-view="list">一覧</button>
  <button data-view="priority">育成予定</button>
  <button data-view="stats">分析</button>
  <button data-view="settings">設定</button>
</nav>

<main>
<section id="listView">
  <div class="panel search-panel">
    <div class="search-row">
      <input id="searchInput" type="search" placeholder="ツム名を検索">
      <select id="sortSelect">
        <option value="name">名前順</option>
        <option value="progress">進捗順</option>
        <option value="remain">残り順</option>
        <option value="owned">所持数順</option>
        <option value="favorite">お気に入り順</option>
      </select>
    </div>
    <div id="categoryChips" class="chips"></div>
    <div id="statusChips" class="chips secondary"></div>
  </div>

  <div class="list-head">
    <span id="resultCount"></span>
    <div class="list-tools">
      <button id="layoutMode">コンパクト</button>
      <button id="incrementMode">＋1モード</button>
    </div>
  </div>
  <div id="tsumList" class="tsum-list"></div>
</section>

<section id="priorityView" hidden>
  <div class="panel">
    <h2>育成予定</h2>
    <p class="small">各ツムの「•••」から育成予定に追加できます。</p>
    <div id="priorityList" class="tsum-list"></div>
  </div>
</section>

<section id="statsView" hidden>
  <div class="panel"><h2>カテゴリ別進捗</h2><div id="categoryStats"></div></div>
  <div class="panel"><h2>育成状況</h2><div id="statusStats"></div></div>
  <div class="panel"><h2>必要コイン内訳</h2><div id="coinStats"></div></div>
</section>

<section id="settingsView" hidden>
  <div class="panel settings">
    <h2>データ管理</h2>
    <button id="exportFile">バックアップをファイル保存</button>
    <label class="file-label">バックアップを読み込む<input id="importFile" type="file" accept=".json,application/json"></label>
    <button id="mergeMaster">収録ツムを再統合</button>
    <button id="resetData" class="danger">すべて初期化</button>
  </div>
  <div class="panel settings">
    <h2>表示</h2>
    <label class="switch-row"><span>ダークモード</span><input id="darkToggle" type="checkbox"></label>
    <label class="switch-row"><span>起動時からコンパクト表示</span><input id="compactToggle" type="checkbox"></label>
    <p class="small">収録数：<b id="masterCount"></b>体。必要数や画像は各ツムから変更できます。</p>
  </div>
</section>
</main>
</div>

<dialog id="editDialog">
<form id="editForm">
  <h2 id="dialogTitle">ツムを編集</h2>
  <input id="editId" type="hidden">
  <label>ツム名<input id="editName" required></label>
  <div class="form2">
    <label>カテゴリ<input id="editCategory" required></label>
    <label>スキルマ必要数<input id="editRequired" type="number" min="1" max="999" required></label>
  </div>
  <div class="form2">
    <label>現在数<input id="editOwned" type="number" min="0" max="999" required></label>
    <label>育成優先度
      <select id="editPriority">
        <option value="0">設定なし</option>
        <option value="1">最優先</option>
        <option value="2">優先</option>
        <option value="3">あとで</option>
      </select>
    </label>
  </div>
  <label>画像<input id="editImageFile" type="file" accept="image/*"></label>
  <div id="imagePreview" class="preview"></div>
  <label>メモ<textarea id="editMemo"></textarea></label>
  <div class="dialog-actions">
    <button type="button" id="deleteTsum" class="danger">削除</button>
    <button type="button" id="cancelEdit">キャンセル</button>
    <button type="submit" class="primary">保存</button>
  </div>
</form>
</dialog>

<dialog id="drawDialog">
<form id="drawForm">
  <h2>BOX結果をまとめて入力</h2>
  <p class="small">1行に1体入力します。同じツムを複数引いた場合は複数行入力してください。</p>
  <textarea id="drawText" placeholder="例：&#10;エルサ&#10;野獣&#10;エルサ"></textarea>
  <div id="drawSummary" class="draw-summary"></div>
  <div class="dialog-actions">
    <button type="button" id="cancelDraw">キャンセル</button>
    <button type="button" id="previewDraw">確認</button>
    <button type="submit" class="primary">反映する</button>
  </div>
</form>
</dialog>

<div id="toast"></div>
<script src="./tsums-data.js"></script>
<script src="./app.js"></script>
</body>
</html>
