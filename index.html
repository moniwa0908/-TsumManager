<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ツム管理">
<link rel="manifest" href="manifest.json">
<title>TsumManager</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#7c3aed;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#182235;--text:#f8fafc;--muted:#a7b0c0;--line:#2d3a50}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{margin:0;font-size:24px}.small{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 8px 24px rgba(15,23,42,.05)}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.big{font-size:27px;font-weight:800}.label{font-size:13px;color:var(--muted)}
.progress{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:9px}.progress div{height:100%;background:var(--accent)}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px}input,select,button,textarea{font:inherit}
input,select,textarea{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:13px;padding:11px;width:100%}
button{border:0;border-radius:12px;padding:10px 12px;background:var(--accent);color:#fff;font-weight:700}.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}
.filters{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.filters button{white-space:nowrap}.list{display:flex;flex-direction:column;gap:9px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:6px}.controls button{width:35px;height:35px;padding:0;font-size:20px}.count{min-width:62px;text-align:center;font-weight:800}.max{color:var(--ok)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--text);width:min(92vw,520px);padding:18px}dialog::backdrop{background:rgba(0,0,0,.45)}
.grid{display:grid;gap:9px}textarea{min-height:160px}.empty{text-align:center;color:var(--muted);padding:28px}
</style>
</head>
<body><main class="wrap">
<header><div><h1>ツム管理</h1><div class="small">TsumManager Ver.1</div></div><button class="secondary" id="addBtn">＋追加</button></header>
<section class="summary">
<div class="card"><div class="label">スキルマ</div><div class="big" id="maxed">0 / 0</div><div class="progress"><div id="bar"></div></div></div>
<div class="card"><div class="label">残り必要数</div><div class="big" id="remaining">0</div><div class="label" id="rate">0%</div></div>
</section>
<section class="toolbar"><input id="search" type="search" placeholder="ツム名を検索"><select id="sort"><option value="name">名前順</option><option value="remaining">残りが少ない順</option><option value="progress">進捗が高い順</option></select></section>
<div class="filters" id="filters"></div><section class="list" id="list"></section>
<div class="actions"><button class="secondary" id="exportBtn">バックアップ出力</button><button class="secondary" id="importBtn">バックアップ読込</button></div>
<div class="note">データはこのiPhoneのSafari内に自動保存されます。Safariの履歴・Webサイトデータを削除すると消える可能性があるため、定期的にバックアップしてください。</div>
</main>
<dialog id="addDialog"><form method="dialog" class="grid" id="addForm"><h3>ツムを追加</h3><input id="addName" required placeholder="ツム名"><input id="addCategory" required placeholder="カテゴリ"><input id="addMax" required type="number" min="1" max="200" placeholder="スキルマまでの必要数"><div><button value="cancel" class="secondary">キャンセル</button> <button value="default">追加</button></div></form></dialog>
<dialog id="dataDialog"><div class="grid"><h3 id="dataTitle">バックアップ</h3><textarea id="dataText"></textarea><div><button class="secondary" id="closeData">閉じる</button> <button id="applyImport">読み込む</button></div></div></dialog>
<script>
const STARTER=[{"id": "mickey", "name": "ミッキー", "category": "ハピネス", "maxCopies": 8, "owned": 0}, {"id": "minnie", "name": "ミニー", "category": "ハピネス", "maxCopies": 8, "owned": 0}, {"id": "donald", "name": "ドナルド", "category": "ハピネス", "maxCopies": 8, "owned": 0}, {"id": "daisy", "name": "デイジー", "category": "ハピネス", "maxCopies": 8, "owned": 0}, {"id": "goofy", "name": "グーフィー", "category": "ハピネス", "maxCopies": 8, "owned": 0}, {"id": "pluto", "name": "プルート", "category": "ハピネス", "maxCopies": 8, "owned": 0}, {"id": "chip", "name": "チップ", "category": "ハピネス", "maxCopies": 8, "owned": 0}, {"id": "dale", "name": "デール", "category": "ハピネス", "maxCopies": 8, "owned": 0}, {"id": "pooh", "name": "プー", "category": "ハピネス", "maxCopies": 8, "owned": 0}, {"id": "piglet", "name": "ピグレット", "category": "ハピネス", "maxCopies": 8, "owned": 0}, {"id": "tigger", "name": "ティガー", "category": "ハピネス", "maxCopies": 8, "owned": 0}, {"id": "eeyore", "name": "イーヨー", "category": "ハピネス", "maxCopies": 8, "owned": 0}, {"id": "cinderella", "name": "シンデレラ", "category": "プレミアム", "maxCopies": 36, "owned": 0}, {"id": "elsa", "name": "エルサ", "category": "プレミアム", "maxCopies": 36, "owned": 0}, {"id": "maleficent", "name": "マレフィセント", "category": "プレミアム", "maxCopies": 36, "owned": 0}, {"id": "beast", "name": "野獣", "category": "プレミアム", "maxCopies": 36, "owned": 0}, {"id": "jedi-luke", "name": "ジェダイルーク", "category": "期間限定", "maxCopies": 36, "owned": 0}, {"id": "captain-lightyear", "name": "キャプテンライトイヤー", "category": "期間限定", "maxCopies": 36, "owned": 0}];
const KEY="tsumManagerDataV1";
let tsums=JSON.parse(localStorage.getItem(KEY)||JSON.stringify(STARTER)),activeCategory="すべて";
const save=()=>localStorage.setItem(KEY,JSON.stringify(tsums));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
function render(){
 const q=search.value.trim().toLowerCase(),sortBy=sort.value,cats=["すべて",...new Set(tsums.map(t=>t.category))];
 filters.innerHTML=cats.map(c=>`<button class="${c===activeCategory?"":"secondary"}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
 filters.querySelectorAll("button").forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;render()});
 let rows=tsums.filter(t=>(activeCategory==="すべて"||t.category===activeCategory)&&t.name.toLowerCase().includes(q));
 rows.sort((a,b)=>sortBy==="remaining"?(a.maxCopies-a.owned)-(b.maxCopies-b.owned):sortBy==="progress"?(b.owned/b.maxCopies)-(a.owned/a.maxCopies):a.name.localeCompare(b.name,"ja"));
 list.innerHTML=rows.length?rows.map(t=>{let rem=Math.max(0,t.maxCopies-t.owned),pct=Math.round(t.owned/t.maxCopies*100);return `<article class="card item"><div><div class="name">${esc(t.name)}</div><div class="meta">${esc(t.category)} ・ 残り ${rem} ・ ${pct}%</div></div><div class="controls"><button class="secondary" data-a="minus" data-id="${esc(t.id)}">−</button><div class="count ${rem===0?"max":""}">${t.owned}/${t.maxCopies}</div><button data-a="plus" data-id="${esc(t.id)}">＋</button></div></article>`}).join(""):`<div class="empty">該当するツムがありません</div>`;
 list.querySelectorAll("button").forEach(b=>b.onclick=()=>{let t=tsums.find(x=>x.id===b.dataset.id);if(b.dataset.a==="plus")t.owned=Math.min(t.maxCopies,t.owned+1);else t.owned=Math.max(0,t.owned-1);save();render()});
 let m=tsums.filter(t=>t.owned>=t.maxCopies).length,r=tsums.reduce((s,t)=>s+Math.max(0,t.maxCopies-t.owned),0),p=tsums.length?Math.round(m/tsums.length*100):0;
 maxed.textContent=`${m} / ${tsums.length}`;remaining.textContent=r.toLocaleString("ja-JP");rate.textContent=`${p}%`;bar.style.width=`${p}%`;
}
search.oninput=render;sort.onchange=render;
addBtn.onclick=()=>addDialog.showModal();
addForm.onsubmit=e=>{if(e.submitter?.value==="cancel")return;e.preventDefault();let n=addName.value.trim(),c=addCategory.value.trim(),m=Number(addMax.value);if(!n||!c||!m)return;tsums.push({id:"u-"+Date.now(),name:n,category:c,maxCopies:m,owned:0});save();addDialog.close();addForm.reset();render()};
exportBtn.onclick=()=>{dataTitle.textContent="バックアップ出力";dataText.value=JSON.stringify(tsums,null,2);applyImport.style.display="none";dataDialog.showModal();dataText.select()};
importBtn.onclick=()=>{dataTitle.textContent="バックアップ読込";dataText.value="";applyImport.style.display="";dataDialog.showModal()};
closeData.onclick=()=>dataDialog.close();
applyImport.onclick=()=>{try{let x=JSON.parse(dataText.value);if(!Array.isArray(x))throw 0;tsums=x;save();dataDialog.close();render();alert("読み込みました")}catch(e){alert("データ形式が正しくありません")}};
if("serviceWorker"in navigator)navigator.serviceWorker.register("service-worker.js");
render();
</script></body></html>
